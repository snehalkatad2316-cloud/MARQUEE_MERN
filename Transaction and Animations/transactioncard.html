<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        margin: 100px;
        padding: 10px;
        width: 100px;
        height: 100px;
        position: relative;
        background-color: rgb(91, 140, 183);
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;

        transition-property: all;
        transition-duration: 5s;
        transition-timing-function: 1s;
        transition-delay: 1s;
      }
      .box:hover {
        background-color: brown;
        border: 2px solid black;
      }
      #box2 {
        /* margin: 0px; */
        /* padding: 10px; */
        top: -10px;
        right: -10px;
        width: 30px;
        height: 30px;
        position: absolute;
        background-color: rgb(202, 119, 179);
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;

        transition-property: all;
        transition-duration: 5s;
        transition-timing-function: 1s;
        transition-delay: 1s;
        border-radius: 50px;
      }
      #box2:hover {
        background-color: rgb(67, 7, 7);
        border: 2px solid rgb(218, 211, 211);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div id="box2"></div>
    </div>
  </body>
</html>
