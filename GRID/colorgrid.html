<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Items-Alignment</title>

      body {
        height: 100%;
        width: 100vw;
      }

      #container {
        display: grid;
        grid-template-columns: repeat(5, 100px);
        grid-template-rows: repeat(3, 100px);
        /* What is the Difference Btweeen Cells and Items */
        /* grid-row and grid-col */
        /* grid-template-areas:; */
      }

      /* Different Color to each Items  */
      #item-1 {
        background-color: rgb(197, 71, 8);
      }
      #item-2 {
        background-color: blue;
      }
      #item-3 {
        background-color: yellow;
      }
      #item-4 {
        background-color: green;
      }
      #item-5 {
        background-color: green;
      }
      #item-6 {
        background-color: green;
      }
      #item-7 {
        background-color: green;
      }
      #item-8 {
        background-color: rgb(196, 216, 79);
      }
      #item-9 {
        background-color: rgb(163, 211, 4);
      }
      #item-10 {
        background-color: rgb(149, 162, 33);
      }
      #item-11 {
        background-color: green;
      }
      #item-12 {
        background-color: rgb(83, 138, 83);
      }

      #item-13 {
        background-color: rgb(20, 132, 20);
      }
      #item-14 {
        background-color: rgb(10, 70, 10);
      }
      #item-15 {
        background-color: rgb(2, 24, 2);
      }

      .items {
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="items" id="item-1"></div>
      <div class="items" id="item-2"></div>
      <div class="items" id="item-3"></div>
      <div class="items" id="item-4"></div>
      <div class="items" id="item-5"></div>
      <div class="items" id="item-6"></div>
      <div class="items" id="item-7"></div>
      <div class="items" id="item-8"></div>
      <div class="items" id="item-9"></div>
      <div class="items" id="item-10"></div>
      <div class="items" id="item-11"></div>
      <div class="items" id="item-12"></div>
      <div class="items" id="item-13"></div>
      <div class="items" id="item-14"></div>
      <div class="items" id="item-15"></div>
    </div>
  </body>
</html>
