<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        height: 100%;
        width: 100%;
      }

      #container {
        display: grid;
        grid-template-columns: repeat(4, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 10px;
        /* What is the Difference Btweeen Cells and Items */
        /* grid-row and grid-col */
        /* grid-template-areas:; */
      }

      /* Different Color to each Items  */
      #item-1 {
        background-color: rgb(239, 4, 20);
        grid-row: span 3;
      }
      #item-2 {
        background-color: rgb(236, 49, 49);
        grid-column: span 2;
      }
      #item-3 {
        background-color: rgb(212, 81, 81);
      }
      #item-4 {
        background-color: rgb(133, 33, 40);
      }
      #item-5 {
        background-color: red;
      }
      #item-6 {
        background-color: rgb(217, 76, 30);
        grid-row: span 2;
      }
      #item-7 {
        background-color: rgb(205, 71, 56);
      }
      #item-8 {
        background-color: rgb(20, 154, 20);
      }

      .items {
        /* height: 200; */
        border: 1px xolid black;
        display: flex;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="items" id="item-1">1</div>
      <div class="items" id="item-2">2</div>
      <div class="items" id="item-3">3</div>
      <div class="items" id="item-4">4</div>
      <div class="items" id="item-5">5</div>
      <div class="items" id="item-6">6</div>
      <div class="items" id="item-7">7</div>
      <div class="items" id="item-8">8</div>
      <div class="items" id="item-9">9</div>
      <div class="items" id="item-10">10</div>
      <div class="items" id="item-11">11</div>
      <div class="items" id="item-12">12</div>
    </div>
  </body>
</html>
