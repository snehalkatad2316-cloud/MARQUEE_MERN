<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ececec;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{

    width:360px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);

}

.top{

    height:150px;
    background:#3f6df5;
    position:relative;

}

.profile{

    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
    position:absolute;
    bottom:-60px;
    left:50%;
    transform:translateX(-50%);
    overflow:hidden;

}

.profile img{

    width:100%;
    height:100%;
    object-fit:cover;

}

.content{

    padding-top:75px;
    padding-bottom:20px;

}

.content h2{

    font-size:32px;
    color:#333;

}

.content p{

    color:gray;
    margin-top:5px;
    font-size:18px;

}

.social{

    display:flex;
    justify-content:center;
    gap:18px;
    margin:25px 0;

}

.social a{

    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-decoration:none;
    font-size:20px;

}

.facebook{
    background:#1877f2;
}

.twitter{
    background:#1da1f2;
}

.instagram{
    background:#e1306c;
}

.youtube{
    background:rgb(172, 16, 16);
}

.buttons{

    display:flex;
    justify-content:space-evenly;
    margin:20px;

}

button{

    width:140px;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#3f6df5;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#225e05;

}

.stats{

    display:flex;
    justify-content:space-around;
    margin-top:15px;
    font-size:22px;
    color:#555;

}

.stats span{

    font-size:18px;
    margin-left:5px;

}

</style>

</head>
<body>

<div class="card">

<div class="top">

<div class="profile">
<img src="C:\Users\sneha\OneDrive\Pictures\Screenshots\Screenshot 2026-07-08 103812.png" alt="profile">
</div>

</div>

<div class="content">

<h2>CodingLab</h2>

<p>YouTuber & Blogger</p>

<div class="social">

<a href="#" class="facebook">
<i class="fab fa-facebook-f"></i>
</a>

<a href="#" class="twitter">
<i class="fab fa-twitter"></i>
</a>

<a href="#" class="instagram">
<i class="fab fa-instagram"></i>
</a>

<a href="#" class="youtube">
<i class="fab fa-youtube"></i>
</a>

</div>

<div class="buttons">

<button>Subscribe</button>

<button>Message</button>

</div>

<div class="stats">

<div>
<i class="far fa-heart"></i>
<span>60.4k</span>
</div>

<div>
<i class="far fa-comment"></i>
<span>20k</span>
</div>

<div>
<i class="far fa-share-square"></i>
<span>12.4k</span>
</div>

</div>

</div>

</div>

</body>
</html>
